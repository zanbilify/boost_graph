boost_throw_exception = { version = "0.1.0", path = "../boost_throw_exception" }
boost_tti = { version = "0.1.0", path = "../boost_tti" }
boost_tuple = { version = "0.1.0", path = "../boost_tuple" }
boost_type_traits = { version = "0.1.0", path = "../boost_type_traits" }
