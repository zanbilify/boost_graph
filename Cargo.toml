[package]
name = "boost_graph"
description = "Boost C++ library boost_graph packaged using Zanbil"
version = "0.1.0"
edition = "2024"
links = "boost_graph"
license = "BSL-1.0"
repository = "https://github.com/zanbilify/boost_graph"

[package.metadata.zanbil]
make_dependencies_public = true

[dependencies]
boost_algorithm = { version = "0.1.0", path = "../boost_algorithm" }
boost_any = { version = "0.1.0", path = "../boost_any" }
boost_array = { version = "0.1.0", path = "../boost_array" }
